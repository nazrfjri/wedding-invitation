<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="P&Z wedding monogram logo">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7D98A"/>
      <stop offset="0.5" stop-color="#D9A83E"/>
      <stop offset="1" stop-color="#B98224"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A66BFF"/>
      <stop offset="1" stop-color="#6C2BDA"/>
    </linearGradient>
  </defs>

  <!-- transparent background; designed for favicon / invitation URL preview -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="256" cy="256" r="207" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".55"/>

  <!-- subtle decorative diamond -->
  <path d="M256 56 L266 76 L286 86 L266 96 L256 116 L246 96 L226 86 L246 76 Z"
        fill="url(#violet)"/>

  <!-- P -->
  <text x="218" y="324"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="190"
        font-weight="400"
        fill="#F4EBDD">P</text>

  <!-- Z, slightly overlapping to create a monogram -->
  <text x="303" y="324"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="190"
        font-weight="400"
        fill="url(#violet)">Z</text>

  <!-- elegant ampersand -->
  <text x="258" y="355"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="72"
        font-style="italic"
        fill="url(#gold)">&amp;</text>

  <!-- tiny wedding divider -->
  <path d="M176 386 C210 374 302 374 336 386"
        fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="168" cy="389" r="4" fill="url(#gold)"/>
  <circle cx="344" cy="389" r="4" fill="url(#gold)"/>
</svg>
