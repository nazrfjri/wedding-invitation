<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wedding.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Google Fonts: Plus Jakarta Sans, Cormorant Garamond, Pinyon Script -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Pinyon+Script&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

    <!-- Primary Meta Tags -->
    <title>Putri & Zagar</title>
    <meta name="title" content="The Wedding of Putri & Zagar" />
    <meta name="description" content="Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir untuk memberikan do'a restu. 17 Agustus 2026." />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <!-- Ganti URL_WEBSITE_ANDA di bawah ini dengan URL domain publik saat deploy -->
    <meta property="og:url" content="https://URL_WEBSITE_ANDA.com/" />
    <meta property="og:title" content="The Wedding of Putri & Zagar" />
    <meta property="og:description" content="Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir di hari bahagia kami." />
    <!-- Gambar ini harus berada di folder public/og-image.jpg -->
    <meta property="og:image" content="https://URL_WEBSITE_ANDA.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://URL_WEBSITE_ANDA.com/" />
    <meta property="twitter:title" content="The Wedding of Putri & Zagar" />
    <meta property="twitter:description" content="Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir di hari bahagia kami." />
    <meta property="twitter:image" content="https://URL_WEBSITE_ANDA.com/og-image.jpg" />
  </head>
